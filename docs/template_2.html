<html lang="it">

        }

        }

            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }
        
        .controls {
            padding: 20px 30px;
            background: #f8f9fa;
            border-bottom: 2px solid #e9ecef;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
        }
        
        .search-box {
            flex: 1;
            min-width: 250px;
            padding: 12px 20px;
            border: 2px solid #dee2e6;
            border-radius: 8px;
            font-size: 1em;
            transition: all 0.3s;
        }
        
        .search-box:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .filter-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .filter-select {
            padding: 12px 20px;
            border: 2px solid #dee2e6;
            border-radius: 8px;
            font-size: 1em;
            background: white;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .filter-select:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .stats {
            padding: 15px 30px;
            background: #e7f3ff;
            border-bottom: 2px solid #b3d9ff;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        
        .stat-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .stat-label {
            font-weight: 600;
            color: #495057;
        }
        
        .stat-value {
            background: #667eea;
            color: white;
            padding: 4px 12px;
            border-radius: 15px;
            font-weight: 600;
        }
        
        .table-container {
            overflow-x: auto;
            padding: 20px 30px;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9em;
        }
        
        thead {
            background: #667eea;
            color: white;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        
        th {
            padding: 15px 10px;
            text-align: left;
            cursor: pointer;
            user-select: none;
            transition: background 0.3s;
            white-space: nowrap;
        }
        
        th:hover {
            background: #5568d3;
        }
        
        th::after {
            content: ' ⇅';
            opacity: 0.5;
            font-size: 0.8em;
        }
        
        th.sort-asc::after {
            content: ' ↑';
            opacity: 1;
        }
        
        th.sort-desc::after {
            content: ' ↓';
            opacity: 1;
        }
        
        tbody tr {
            border-bottom: 1px solid #e9ecef;
            transition: background 0.2s;
        }
        
        tbody tr:hover {
            background: #f8f9fa;
        }
        
        td {
            padding: 12px 10px;
        }
        
        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.85em;
            font-weight: 600;
            white-space: nowrap;
        }
        
        .badge-low {
            background: #d4edda;
            color: #155724;
        }
        
        .badge-medium {
            background: #fff3cd;
            color: #856404;
        }
        
        .badge-high {
            background: #f8d7da;
            color: #721c24;
        }
        
        .badge-protective {
            background: #d1ecf1;
            color: #0c5460;
        }
        
        .badge-neutral {
            background: #e2e3e5;
            color: #383d41;
        }
        
        .badge-increased {
            background: #f5c6cb;
            color: #721c24;
        }
        
        .data-available {
            color: #28a745;
            font-weight: 600;
        }
        
        .data-missing {
            color: #6c757d;
            font-style: italic;
        }
        
        .no-results {
            text-align: center;
            padding: 40px;
            color: #6c757d;
            font-size: 1.2em;
        }
        
        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8em;
            }
            
            .controls {
                flex-direction: column;
            }
            
            table {
                font-size: 0.8em;
            }
            
            th, td {
                padding: 8px 5px;
            }
        }
    </style>
</head>

        // Variabili globali
        let currentSort = { column: null, direction: 'asc' };
        let filteredFoods = [...foods];

        // Inizializzazione
        document.addEventListener('DOMContentLoaded', function() {
            populateCategoryFilter();
            updateStats();
            renderTable();
            setupEventListeners();
        });

        // Popola il filtro categorie
        function populateCategoryFilter() {
            const categories = [...new Set(foods.map(food => food.category))].sort();
            const categoryFilter = document.getElementById('categoryFilter');
            
            categories.forEach(category => {
                const option = document.createElement('option');
                option.value = category;
                option.textContent = category;
                categoryFilter.appendChild(option);
            });
        }

        // Aggiorna statistiche
        function updateStats() {
            document.getElementById('totalItems').textContent = foods.length;
            document.getElementById('tefItems').textContent = foods.filter(f => f.tef !== undefined).length;
            document.getElementById('visibleItems').textContent = filteredFoods.length;
        }

        // Setup event listeners
        function setupEventListeners() {
            // Ricerca
            document.getElementById('searchInput').addEventListener('input', filterAndRender);
            
            // Filtri
            document.getElementById('categoryFilter').addEventListener('change', filterAndRender);
            document.getElementById('metabolicFilter').addEventListener('change', filterAndRender);
            document.getElementById('tumorFilter').addEventListener('change', filterAndRender);
            
            // Ordinamento
            document.querySelectorAll('th[data-sort]').forEach(th => {
                th.addEventListener('click', function() {
                    const column = this.dataset.sort;
                    sortTable(column);
                });
            });
        }

        // Filtra e renderizza
        function filterAndRender() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const categoryFilter = document.getElementById('categoryFilter').value;
            const metabolicFilter = document.getElementById('metabolicFilter').value;
            const tumorFilter = document.getElementById('tumorFilter').value;

            filteredFoods = foods.filter(food => {
                const matchSearch = food.name.toLowerCase().includes(searchTerm);
                const matchCategory = !categoryFilter || food.category === categoryFilter;
                const matchMetabolic = !metabolicFilter || food.metabolic === metabolicFilter;
                const matchTumor = !tumorFilter || food.tumor === tumorFilter;
                
                return matchSearch && matchCategory && matchMetabolic && matchTumor;
            });

            updateStats();
            renderTable();
        }

        // Ordina tabella
        function sortTable(column) {
            if (currentSort.column === column) {
                currentSort.direction = currentSort.direction === 'asc' ? 'desc' : 'asc';
            } else {
                currentSort.column = column;
                currentSort.direction = 'asc';
            }

            filteredFoods.sort((a, b) => {
                let aVal = a[column];
                let bVal = b[column];

                if (aVal === undefined) aVal = '';
                if (bVal === undefined) bVal = '';

                if (typeof aVal === 'string' && typeof bVal === 'string') {
                    return currentSort.direction === 'asc' 
                        ? aVal.localeCompare(bVal) 
                        : bVal.localeCompare(aVal);
                } else {
                    return currentSort.direction === 'asc' 
                        ? aVal - bVal 
                        : bVal - aVal;
                }
            });

            // Aggiorna indicatori di ordinamento
            document.querySelectorAll('th').forEach(th => {
                th.classList.remove('sort-asc', 'sort-desc');
            });
            
            const activeHeader = document.querySelector(`th[data-sort="${column}"]`);
            activeHeader.classList.add(currentSort.direction === 'asc' ? 'sort-asc' : 'sort-desc');

            renderTable();
        }

        // Renderizza tabella
        function renderTable() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            if (filteredFoods.length === 0) {
                tbody.innerHTML = '<tr><td colspan="12" class="no-results">Nessun alimento trovato</td></tr>';
                return;
            }

            filteredFoods.forEach(food => {
                const row = document.createElement('tr');
                
                row.innerHTML = `
                    <td><strong>${food.name}</strong></td>
                    <td>${food.category || '-'}</td>
                    <td>${food.kcal !== undefined ? food.kcal : '<span class="data-missing">N/D</span>'}</td>
                    <td>${food.tef !== undefined ? food.tef : '<span class="data-missing">N/D</span>'}</td>
                    <td>${food.tefPerc !== undefined ? food.tefPerc + '%' : '<span class="data-missing">N/D</span>'}</td>
                    <td>${food.netKcal !== undefined ? food.netKcal : '<span class="data-missing">N/D</span>'}</td>
                    <td>${food.fructose !== undefined ? food.fructose : '<span class="data-missing">N/D</span>'}</td>
                    <td>${food.fiber !== undefined ? food.fiber : '<span class="data-missing">N/D</span>'}</td>
                    <td>${food.ratio !== undefined ? food.ratio : '<span class="data-missing">N/D</span>'}</td>
                    <td>${getBadge(food.malabsorption, 'malabsorption')}</td>
                    <td>${getBadge(food.metabolic, 'metabolic')}</td>
                    <td>${getBadge(food.tumor, 'tumor')}</td>
                `;
                
                tbody.appendChild(row);
            });
        }

        // Crea badge colorato
        function getBadge(value, type) {
            if (!value) return '<span class="data-missing">N/D</span>';
            
            let className = '';
            
            if (type === 'malabsorption' || type === 'metabolic') {
                if (value === 'Basso') className = 'badge-low';
                else if (value === 'Medio') className = 'badge-medium';
                else if (value === 'Alto') className = 'badge-high';
            } else if (type === 'tumor') {
                if (value === 'Protettivo') className = 'badge-protective';
                else if (value === 'Neutro') className = 'badge-neutral';
                else if (value === 'Aumentato') className = 'badge-increased';
            }
            
            return `<span class="badge ${className}">${value}</span>`;
        }
    </script>
