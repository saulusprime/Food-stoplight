name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  controlli:
    name: Lint, tipi e test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Dipendenze
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Tipi (mypy)
        run: mypy

      - name: Test (pytest)
        run: pytest

  docker:
    name: Immagine Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build -t food-stoplight .

      - name: Avvio e controllo di salute
        run: |
          docker run -d --name app -p 8000:8000 \
            -e FLASK_SECRET_KEY="$(python3 -c 'import secrets; print(secrets.token_hex(32))')" \
            -e ADMIN_USERNAME=admin_ci -e ADMIN_PASSWORD=password-di-prova \
            food-stoplight
          for tentativo in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/salute; then
              curl -fsS "http://127.0.0.1:8000/api/alimenti?limit=1" > /dev/null
              docker logs app 2>&1 | grep -q "Amministratore 'admin_ci' creato"
              exit 0
            fi
            sleep 1
          done
          docker logs app
          exit 1
